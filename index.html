<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>УЗИ — Тестирование</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e2e8f0;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 32px 20px; }

  /* HOME */
  .home-header { text-align: center; margin-bottom: 40px; }
  .wave-icon { display: block; margin: 0 auto 16px; }
  h1 { font-size: clamp(22px, 4vw, 34px); font-weight: 800; color: #f0f9ff; letter-spacing: -0.5px; margin-bottom: 8px; }
  .subtitle { color: #94a3b8; font-size: 15px; }
  .sections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .section-btn {
    background: rgba(14,165,233,0.1);
    border: 1.5px solid rgba(56,189,248,0.3);
    border-radius: 16px;
    padding: 20px 12px;
    cursor: pointer;
    color: #e2e8f0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: all 0.2s;
  }
  .section-btn:hover {
    background: rgba(14,165,233,0.22);
    border-color: #38bdf8;
    transform: translateY(-2px);
  }
  .section-num { font-size: 30px; font-weight: 800; color: #38bdf8; line-height: 1; }
  .section-label { font-size: 13px; color: #94a3b8; }
  .section-count { font-size: 12px; color: #64748b; }

  /* QUIZ */
  .quiz-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 22px; padding: 4px; line-height: 1; }
  .progress-wrap { flex: 1; }
  .progress-meta { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; color: #64748b; font-weight: 600; }
  .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #0ea5e9, #38bdf8); border-radius: 3px; transition: width 0.3s; }
  .score-badge {
    background: rgba(56,189,248,0.15);
    border: 1px solid rgba(56,189,248,0.3);
    border-radius: 20px; padding: 4px 12px;
    font-size: 13px; color: #38bdf8; font-weight: 700; white-space: nowrap;
  }
  .question-card {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 24px;
    margin-bottom: 16px;
    font-size: clamp(14px,2.5vw,17px);
    line-height: 1.65; color: #f1f5f9; font-weight: 500;
  }
  .answers { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .answer-btn {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 13px 16px;
    text-align: left; cursor: pointer; color: #cbd5e1;
    font-size: clamp(13px,2vw,15px); line-height: 1.5;
    transition: all 0.18s;
    display: flex; align-items: center; gap: 12px;
    font-family: inherit; width: 100%;
  }
  .answer-btn:hover:not(:disabled) { background: rgba(255,255,255,0.09); }
  .answer-btn.selected { background: rgba(56,189,248,0.12); border-color: #38bdf8; color: #bae6fd; }
  .answer-btn.correct { background: rgba(74,222,128,0.12); border-color: #4ade80; color: #bbf7d0; }
  .answer-btn.wrong { background: rgba(248,113,113,0.12); border-color: #f87171; color: #fecaca; }
  .marker {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #64748b;
    flex-shrink: 0; transition: all 0.18s;
  }
  .marker.sel { background: #38bdf8; color: #0f172a; }
  .marker.ok { background: #4ade80; color: #0f172a; }
  .marker.err { background: #f87171; color: #0f172a; }
  .correct-hint {
    background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.25);
    border-radius: 14px; padding: 12px 16px;
    margin-bottom: 16px; font-size: 14px;
    display: none;
  }
  .correct-hint .label { color: #86efac; }
  .correct-hint .text { color: #4ade80; font-weight: 600; }
  .action-btn {
    width: 100%; border: none; border-radius: 14px;
    padding: 15px; cursor: pointer; font-weight: 700;
    font-size: 16px; transition: all 0.2s; font-family: inherit;
  }
  .action-btn.confirm {
    background: rgba(255,255,255,0.05); color: #475569; cursor: not-allowed;
  }
  .action-btn.confirm.active {
    background: linear-gradient(135deg, #0ea5e9, #38bdf8); color: #0f172a; cursor: pointer;
  }
  .action-btn.next {
    background: linear-gradient(135deg, #0ea5e9, #38bdf8); color: #0f172a; cursor: pointer;
  }

  /* RESULT */
  .result-header { text-align: center; margin-bottom: 28px; }
  .result-emoji { font-size: 60px; margin-bottom: 8px; }
  .result-title { font-size: 26px; font-weight: 800; color: #f0f9ff; margin-bottom: 4px; }
  .result-sub { color: #94a3b8; }
  .result-stats {
    background: rgba(14,165,233,0.08);
    border: 1.5px solid rgba(56,189,248,0.25);
    border-radius: 20px; padding: 24px;
    display: flex; gap: 24px; flex-wrap: wrap;
    justify-content: center; margin-bottom: 24px;
  }
  .stat { text-align: center; }
  .stat-val { font-size: 44px; font-weight: 800; line-height: 1; }
  .stat-label { font-size: 13px; color: #94a3b8; margin-top: 4px; }
  .errors-title { font-size: 17px; font-weight: 700; color: #f87171; margin-bottom: 14px; }
  .errors-list { display: flex; flex-direction: column; gap: 10px; }
  .error-card {
    background: rgba(248,113,113,0.07);
    border: 1px solid rgba(248,113,113,0.2);
    border-radius: 12px; padding: 14px;
  }
  .error-q { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 8px; }
  .error-wrong { font-size: 13px; color: #fca5a5; margin-bottom: 3px; }
  .error-right { font-size: 13px; color: #4ade80; }
  .result-btns { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  .result-btn {
    flex: 1; min-width: 140px; border-radius: 12px;
    padding: 13px 20px; cursor: pointer; font-weight: 600;
    font-size: 15px; transition: all 0.2s; font-family: inherit;
  }
  .result-btn.retry {
    background: rgba(56,189,248,0.15);
    border: 1.5px solid #38bdf8; color: #38bdf8;
  }
  .result-btn.retry:hover { background: rgba(56,189,248,0.28); }
  .result-btn.home {
    background: rgba(148,163,184,0.1);
    border: 1.5px solid rgba(148,163,184,0.3); color: #94a3b8;
  }
  .result-btn.home:hover { background: rgba(148,163,184,0.2); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="screen-home" class="container">
  <div class="home-header">
    <svg class="wave-icon" viewBox="0 0 120 30" xmlns="http://www.w3.org/2000/svg" width="120" height="30">
      <path d="M0 15 Q10 5 20 15 Q30 25 40 15 Q50 5 60 15 Q70 25 80 15 Q90 5 100 15 Q110 25 120 15"
        fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <h1>УЗИ — Тестирование</h1>
    <p class="subtitle">500 вопросов &middot; 10 разделов &middot; 50 вопросов в разделе</p>
  </div>
  <div class="sections-grid" id="sections-grid"></div>
</div>

<!-- QUIZ SCREEN -->
<div id="screen-quiz" class="container hidden">
  <div class="quiz-header">
    <button class="back-btn" id="btn-back">&#8592;</button>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="section-label">Раздел 1</span>
        <span id="q-counter">1 / 50</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="score-badge" id="score-badge">0 ✓</div>
  </div>
  <div class="question-card" id="question-text"></div>
  <div class="answers" id="answers"></div>
  <div class="correct-hint" id="correct-hint">
    <span class="label">✓ Правильный ответ: </span>
    <span class="text" id="correct-hint-text"></span>
  </div>
  <button class="action-btn confirm" id="btn-confirm">Подтвердить ответ</button>
  <button class="action-btn next hidden" id="btn-next">Следующий вопрос →</button>
</div>

<!-- RESULT SCREEN -->
<div id="screen-result" class="container hidden">
  <div class="result-header">
    <div class="result-emoji" id="result-emoji">🎯</div>
    <div class="result-title" id="result-title">Раздел завершён</div>
    <div class="result-sub">Результаты тестирования</div>
  </div>
  <div class="result-stats">
    <div class="stat"><div class="stat-val" id="stat-pct">0%</div><div class="stat-label">Процент</div></div>
    <div class="stat"><div class="stat-val" id="stat-score" style="color:#38bdf8">0/50</div><div class="stat-label">Правильных</div></div>
    <div class="stat"><div class="stat-val" id="stat-grade" style="font-size:24px;padding-top:10px">—</div><div class="stat-label">Оценка</div></div>
  </div>
  <div id="errors-block"></div>
  <div class="result-btns">
    <button class="result-btn retry" id="btn-retry">🔄 Повторить раздел</button>
    <button class="result-btn home" id="btn-home">← К разделам</button>
  </div>
</div>

<script>
const RAW_QUESTIONS = [{"id":1,"question":"Процесс, на котором основано применение ультразвукового метода исследования - это:","answers":["прием отраженных сигналов и распространение  ультразвуковых волн","взаимодействие ультразвука с тканями тела человека","визуализация органов и тканей на экране прибора","серошкальное представление изображения на экране прибора"],"correct":0},{"id":2,"question":"Ультразвук отражается от границы сред, имеющих различия в:","answers":["акустическом сопротивлении","Плотности","скорости распространения ультразвука","Упругости"],"correct":0},{"id":3,"question":"При классической картине цирроза в ультразвуковой картине печени:","answers":["контуры неровные, бугристые, края тупые","контуры ровные, края острые","контуры ровные, края закруглены","контуры неровные, зубчатые, края острые"],"correct":0},{"id":4,"question":"При проведении допплеровского  исследования печеночных вен при отсутствии патологии печени отмечают на протяжении сердечного цикла:","answers":["ток крови в печеночных венах имеет разнонаправленный и ламинарный  характер","ток крови в печеночных венах имеет разнонаправленный и турбулентный  характер","ток крови в печеночных венах имеет однонаправленный и турбулентный  характер","ток крови в печеночных венах имеет однонаправленный и ламинарный характер"],"correct":0},{"id":5,"question":"У почки с патологической подвижностью:","answers":["длинный мочеточник, сосуды отходят на уровне L1-L2","короткий мочеточник, сосуды отходят  от  крупных  стволов на почки","имеется разворот осей почки и ее ротация","имеется  сращение  почки  нижним  полюсом с контрлатеральной почкой"],"correct":0},{"id":6,"question":"Наиболее  ранним ультразвуковым симптомом  острого  отторжения трасплантанта является:","answers":["увеличение передне-заднего размера почки","снижение эхогенности паренхимы","повышение эхогенности коркового вещества почки","образование околопочечных затеков"],"correct":0},{"id":7,"question":"Фиброаденома молочной железы представляет собой при ультразвуковом исследовании:","answers":["гипоэхогенное образование с четкой фиброзной капсулой","гиперэхогенное образование без капсулы","гиперэхогенное образование с дорсальным усилением","гипоэхогенное образование без капсулы"],"correct":0},{"id":8,"question":"Абсцесс молочной железы на различных этапах своего формирования при ультразвуковом исследовании будет иметь:","answers":["различную зхокардиографическую картину","примерно одинаковую картину"],"correct":0},{"id":9,"question":"Для злокачественных образований в молочной железе характерна следующая их ориентация:","answers":["Вертикальная","горизонтальная","Смешанная","верно все"],"correct":0},{"id":10,"question":"Эхографически при тиреоидитах щитовидная железа может быть:","answers":["все перечисленное верно","уменьшена в размерах","нормальных размеров","увеличена в размерах"],"correct":0},{"id":11,"question":"Об аплазии щитовидной железы при ультразвуковом исследовании свидетельствует:","answers":["отсутствие изображения ткани железы","смещение мышц","смещение сосудистого пучка"],"correct":0},{"id":12,"question":"При ультразвуковом исследовании картину тиреоидита необходимо дифференцировать с:","answers":["раком щитовидной железы","многоузловым зобом","узловым зобом"],"correct":0},{"id":13,"question":"При ультразвуковом исследовании щитовидной железы необходимо измерять:","answers":["длину, ширину и толщину каждой доли и толщину перешейка","по одному размеру каждой доли","длину, косой размер долей и толщину перешейка","периметр щитовидной железы на поперечной томограмме"],"correct":0},{"id":14,"question":"При ультразвуковом исследовании структуру щитовидной железы можно отнести к:","answers":["паренхиматозному органу","жидкость-содержащему органу","органу смешанного кистозно-солидного строения"],"correct":0},{"id":15,"question":"При осмотре щитовидной железы особенно важны группы лимфатических  узлов:","answers":["глубокие яремные","Подчелюстные","Паратрахеальные","заднего латерального треугол function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let sections = [];
let state = {
  sectionIdx: 0,
  questionIdx: 0,
  selected: null,
  confirmed: false,
  score: 0,
  wrongAnswers: []
};

function buildSections() {
  const shuffled = shuffle(RAW_QUESTIONS);
  sections = [];
  for (let i = 0; i < 10; i++) {
    const chunk = shuffled.slice(i * 50, i * 50 + 50);
    sections.push(chunk.map(q => {
      const correctText = q.answers[q.correct];
      return { ...q, shuffledAnswers: shuffle(q.answers), correctText };
    }));
  }
}

function show(id) {
  ['home','quiz','result'].forEach(s => {
    document.getElementById('screen-' + s).classList.toggle('hidden', s !== id);
  });
}

function renderHome() {
  show('home');
  const grid = document.getElementById('sections-grid');
  grid.innerHTML = '';
  sections.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'section-btn';
    btn.innerHTML = `<span class="section-num">${i+1}</span><span class="section-label">Раздел</span><span class="section-count">50 вопросов</span>`;
    btn.onclick = () => startSection(i);
    grid.appendChild(btn);
  });
}

function startSection(idx) {
  state = { sectionIdx: idx, questionIdx: 0, selected: null, confirmed: false, score: 0, wrongAnswers: [] };
  renderQuiz();
  show('quiz');
}

function renderQuiz() {
  const sec = sections[state.sectionIdx];
  const q = sec[state.questionIdx];
  const total = sec.length;
  const idx = state.questionIdx;

  document.getElementById('section-label').textContent = 'Раздел ' + (state.sectionIdx + 1);
  document.getElementById('q-counter').textContent = (idx + 1) + ' / ' + total;
  document.getElementById('progress-fill').style.width = (idx / total * 100) + '%';
  document.getElementById('score-badge').textContent = state.score + ' ✓';
  document.getElementById('question-text').textContent = q.question;

  const answersEl = document.getElementById('answers');
  answersEl.innerHTML = '';
  q.shuffledAnswers.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.dataset.ans = ans;
    btn.innerHTML = `<span class="marker" id="marker-${i}">${String.fromCharCode(65+i)}</span><span>${ans}</span>`;
    btn.onclick = () => selectAnswer(ans, i);
    answersEl.appendChild(btn);
  });

  const hint = document.getElementById('correct-hint');
  hint.style.display = 'none';
  document.getElementById('btn-confirm').className = 'action-btn confirm';
  document.getElementById('btn-confirm').classList.remove('active');
  document.getElementById('btn-confirm').classList.remove('hidden');
  document.getElementById('btn-next').classList.add('hidden');
}

function selectAnswer(ans, idx) {
  if (state.confirmed) return;
  state.selected = ans;
  document.querySelectorAll('.answer-btn').forEach((btn, i) => {
    btn.classList.remove('selected');
    document.getElementById('marker-' + i).className = 'marker';
    document.getElementById('marker-' + i).textContent = String.fromCharCode(65 + i);
  });
  const btns = document.querySelectorAll('.answer-btn');
  btns[idx].classList.add('selected');
  document.getElementById('marker-' + idx).className = 'marker sel';
  document.getElementById('btn-confirm').classList.add('active');
}

function confirmAnswer() {
  if (!state.selected) return;
  state.confirmed = true;
  const q = sections[state.sectionIdx][state.questionIdx];
  const isCorrect = state.selected === q.correctText;

  if (isCorrect) {
    state.score++;
  } else {
    state.wrongAnswers.push({ question: q.question, yourAnswer: state.selected, correctAnswer: q.correctText });
  }

  document.querySelectorAll('.answer-btn').forEach((btn, i) => {
    const ans = btn.dataset.ans;
    const marker = document.getElementById('marker-' + i);
    if (ans === q.correctText) {
      btn.classList.add('correct');
      marker.className = 'marker ok';
      marker.textContent = '✓';
    } else if (ans === state.selected && !isCorrect) {
      btn.classList.add('wrong');
      marker.className = 'marker err';
      marker.textContent = '✗';
    }
    btn.disabled = true;
  });

  if (!isCorrect) {
    const hint = document.getElementById('correct-hint');
    hint.style.display = 'block';
    document.getElementById('correct-hint-text').textContent = q.correctText;
  }

  document.getElementById('score-badge').textContent = state.score + ' ✓';
  document.getElementById('btn-confirm').classList.add('hidden');

  const nextBtn = document.getElementById('btn-next');
  nextBtn.classList.remove('hidden');
  const isLast = state.questionIdx + 1 >= sections[state.sectionIdx].length;
  nextBtn.textContent = isLast ? 'Завершить раздел →' : 'Следующий вопрос →';
}

function nextQuestion() {
  const sec = sections[state.sectionIdx];
  if (state.questionIdx + 1 >= sec.length) {
    renderResult();
    show('result');
  } else {
    state.questionIdx++;
    state.selected = null;
    state.confirmed = false;
    renderQuiz();
  }
}

function renderResult() {
  const total = sections[state.sectionIdx].length;
  const pct = Math.round(state.score / total * 100);
  const grade = pct >= 90 ? 'Отлично' : pct >= 75 ? 'Хорошо' : pct >= 60 ? 'Удовлетворительно' : 'Неудовлетворительно';
  const gradeColor = pct >= 90 ? '#4ade80' : pct >= 75 ? '#38bdf8' : pct >= 60 ? '#fbbf24' : '#f87171';

  document.getElementById('result-emoji').textContent = pct >= 60 ? '🎯' : '📋';
  document.getElementById('result-title').textContent = 'Раздел ' + (state.sectionIdx + 1) + ' завершён';
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('stat-pct').style.color = gradeColor;
  document.getElementById('stat-score').textContent = state.score + '/' + total;
  document.getElementById('stat-grade').textContent = grade;
  document.getElementById('stat-grade').style.color = gradeColor;

  const errBlock = document.getElementById('errors-block');
  if (state.wrongAnswers.length > 0) {
    let html = `<div class="errors-title">✗ Ошибки (${state.wrongAnswers.length})</div><div class="errors-list">`;
    state.wrongAnswers.forEach(w => {
      html += `<div class="error-card">
        <div class="error-q">${escHtml(w.question)}</div>
        <div class="error-wrong">✗ Ваш ответ: ${escHtml(w.yourAnswer)}</div>
        <div class="error-right">✓ Правильно: ${escHtml(w.correctAnswer)}</div>
      </div>`;
    });
    html += '</div>';
    errBlock.innerHTML = html;
  } else {
    errBlock.innerHTML = '<div style="text-align:center;color:#4ade80;font-size:18px;font-weight:700;padding:16px 0">🎉 Все ответы верны!</div>';
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Events
document.getElementById('btn-back').onclick = () => { show('home'); };
document.getElementById('btn-confirm').onclick = confirmAnswer;
document.getElementById('btn-next').onclick = nextQuestion;
document.getElementById('btn-retry').onclick = () => startSection(state.sectionIdx);
document.getElementById('btn-home').onclick = () => { show('home'); };

// Init
buildSections();
renderHome();
</script>
</body>
</html>
